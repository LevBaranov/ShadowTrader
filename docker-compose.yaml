services:
  db:
    image: postgres:18
    container_name: shadowtrader-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - pgdata_prod:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrations:
    image: ghcr.io/levbaranov/shadowtrader-back:${VERSION}
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: alembic upgrade head

  api:
    image: ghcr.io/levbaranov/shadowtrader-back:${VERSION}
    container_name: shadowtrader-api
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./logs/api:/app/logs
    env_file: .env
    environment:
      - LOG_PATH=/app/logs
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # Отдельный образ: у бота нет доступа ни к БД, ни к коду бэкенда — только API.
  bot:
    image: ghcr.io/levbaranov/shadowtrader-bot:${VERSION}
    container_name: shadowtrader-bot
    depends_on:
      - api
    volumes:
      - ./logs/bot:/app/logs
    env_file: .env
    environment:
      - API_BASE_URL=http://api:8000
      - LOG_PATH=/app/logs
    restart: unless-stopped

  scheduler:
    image: ghcr.io/levbaranov/shadowtrader-back:${VERSION}
    container_name: shadowtrader-scheduler
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./logs/scheduler:/app/logs
    env_file: .env
    environment:
      - LOG_PATH=/app/logs
    command: python -m src.scheduler.main
    restart: unless-stopped

  ui:
    image: ghcr.io/levbaranov/shadowtrader-ui:${VERSION}
    container_name: shadowtrader-ui
    ports:
      - "80:80"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

volumes:
  pgdata_prod:
    driver: local