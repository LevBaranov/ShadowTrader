services:
  db:
    image: postgres:18
    container_name: shadowtrader-postgres-dev
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d postgres_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: backend.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env-dev
    command: alembic upgrade head

  # Отдельный образ и отдельный контекст сборки: бэкенд боту не виден.
  bot:
    build:
      context: ./bot
      dockerfile: ../bot.Dockerfile
    container_name: shadowtrader-bot-dev
    depends_on:
      - api
    ports:
      - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    volumes:
      - ./bot:/app/bot
      - ./logs/bot:/app/logs
    env_file: .env-dev
    environment:
      - API_BASE_URL=http://api:8000
      - LOG_PATH=/app/logs
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: shadowtrader-scheduler-dev
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./logs/scheduler:/app/logs
    env_file: .env-dev
    environment:
      - LOG_PATH=/app/logs
    command: python -m src.scheduler.main
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: shadowtrader-api-dev
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src
      - ./logs/api:/app/logs
    env_file: .env-dev
    environment:
      - LOG_PATH=/app/logs
    ports:
      - 8000:8000
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      target: dev
    container_name: shadowtrader-ui-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: .env-dev
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
volumes:
  pgdata:
    driver: local